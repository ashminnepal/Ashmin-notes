<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My BITM Notes</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{
    background:#f4f7fb;
    color:#111827;
    transition:0.3s;
}

/* HEADER */

.header{
    background:#F7FBFF;
    padding:14px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    box-shadow:0 2px 12px rgba(0,0,0,0.08);
    position:sticky;
    top:0;
    z-index:100;
    transition:0.3s;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:190px;
}

.logo-icon{
    width:46px;
    height:46px;
    border-radius:12px;
    background:#0b4db8;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}

.logo-text h1{
    font-size:22px;
    color:#0b4db8;
    line-height:1;
}

.logo-text span{
    font-size:14px;
    color:#6b7280;
}

.search-box{
    flex:1;
    max-width:650px;
    background:#f4f7fb;
    border:1px solid #dbe3f0;
    border-radius:999px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 18px;
    transition:0.3s;
}

.search-box span{
    color:#6b7280;
    font-size:18px;
}

.search-box input{
    border:none;
    outline:none;
    background:transparent;
    width:100%;
    font-size:15px;
    color:#111827;
}

.actions{
    display:flex;
    align-items:center;
    gap:12px;
}

.profile{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #e5e7eb;
    display:block;
}

.icon{
    width:40px;
    height:40px;
    flex-shrink:0;
    border-radius:50%;
    background:#f4f7fb;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:0.2s;
    font-size:18px;
    border:none;
}

.icon:hover{
    background:#e8f0fe;
}

/* LOGIN / LOGOUT */

.auth-btn{
    padding:10px 17px;
    border:none;
    border-radius:10px;
    background:#0b4db8;
    color:white;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:0.2s;
}

.auth-btn:hover{
    background:#083c91;
}

.auth-btn:disabled{
    opacity:0.6;
    cursor:wait;
}

/* MOBILE NAVIGATION IS HIDDEN ON PC */

.mobile-bottom-nav{
    display:none;
}

/* LAYOUT */

.container{
    display:flex;
    min-height:calc(100vh - 80px);
}

/* SIDEBAR */

.sidebar{
    width:230px;
    flex-shrink:0;
    background:#ffffff;
    padding:22px 18px;
    box-shadow:2px 0 10px rgba(0,0,0,0.05);
    transition:0.3s;
}

.sidebar .menu{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.menu .item{
    padding:13px 15px;
    border-radius:12px;
    cursor:pointer;
    transition:0.2s;
    font-weight:500;
}

.menu .item.active{
    background:#0b4db8;
    color:white;
}

.menu .item:hover{
    background:#e8f0fe;
}

.menu .item.active:hover{
    background:#0a44a3;
}

/* MAIN CONTENT */

.main{
    flex:1;
    min-width:0;
    padding:26px;
}

.semester-section{
    background:#0b4db8;
    border-radius:22px;
    padding:24px;
    margin-bottom:28px;
}

.semester-section h2{
    color:white;
    margin-bottom:18px;
    font-size:24px;
}

.semester-buttons{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:14px;
}

.semester-buttons button{
    padding:13px 14px;
    border:none;
    border-radius:14px;
    background:white;
    color:#111827;
    font-weight:700;
    cursor:pointer;
    transition:0.2s;
}

.semester-buttons button:hover{
    background:#dbeafe;
}

.semester-buttons button.active{
    background:#0b4db8;
    color:white;
    border:2px solid white;
}

.chapter-title{
    font-size:24px;
    color:#0b4db8;
    margin-bottom:22px;
    font-weight:700;
}

.chapter-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:20px;
}

.chapter-card{
    background:white;
    border-radius:18px;
    padding:22px;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
    border-left:6px solid #0b4db8;
    transition:0.2s;
    cursor:pointer;
}

.chapter-card:hover{
    transform:translateY(-3px);
    background:#f8fbff;
}

.chapter-number{
    font-size:14px;
    font-weight:700;
    color:#0b4db8;
    margin-bottom:10px;
}

.chapter-name{
    font-size:18px;
    font-weight:700;
    line-height:1.4;
}

/* DARK MODE */

body.dark-mode{
    background:#111827;
    color:#f9fafb;
}

body.dark-mode .header{
    background:#1f2937;
    box-shadow:0 2px 12px rgba(0,0,0,0.3);
}

body.dark-mode .logo-text h1{
    color:#60a5fa;
}

body.dark-mode .logo-text span{
    color:#9ca3af;
}

body.dark-mode .search-box{
    background:#374151;

}

body.dark-mode .search-box input{
    color:white;
}

body.dark-mode .search-box input::placeholder{
    color:#9ca3af;
}

body.dark-mode .search-box span{
    color:#d1d5db;
}

body.dark-mode .icon{
    background:#374151;
}

body.dark-mode .icon:hover{
    background:#4b5563;
}

body.dark-mode .profile{
    border-color:#4b5563;
}

body.dark-mode .sidebar{
    background:#1f2937;
    box-shadow:2px 0 10px rgba(0,0,0,0.3);
}

body.dark-mode .menu .item{
    color:#f9fafb;
}

body.dark-mode .menu .item:hover{
    background:#374151;
}

body.dark-mode .menu .item.active{
    background:#0b4db8;
    color:white;
}

body.dark-mode .chapter-title{
    color:#60a5fa;
}

body.dark-mode .chapter-card{
    background:#1f2937;
    color:#f9fafb;
    box-shadow:0 6px 18px rgba(0,0,0,0.3);
}

body.dark-mode .chapter-card:hover{

}

body.dark-mode .chapter-number{
    color:#60a5fa;
}

body.dark-mode .chapter-name{
    color:#f9fafb;
}

/* KEEP ORIGINAL TABLET LAYOUT */

@media(max-width:900px){
    .container{
        flex-direction:column;
    }

        width:100%;

    }

    .sidebar .menu{

/* MOBILE-ONLY DESIGN */

    /* Fixed Facebook-style bottom navigation */

<body>

<!-- HEADER -->

<div class="header">

    <div class="logo">
        <div class="logo-icon">📘</div>

        <div class="logo-text">
            <h1>My BITM</h1>
            <span>Notes</span>
        </div>
    </div>

    <div class="search-box">
        <span>🔍</span>
        <input
            type="text"
            placeholder="Search for chapters, subjects, or keywords..."
        >
    </div>

    <div class="actions">

        <!-- DESKTOP LOGIN / LOGOUT -->

        <button
            id="authBtn"
            class="auth-btn"
            type="button"
            onclick="handleAuthClick()"
            disabled
        >Checking...</button>

        <a href="profile.html">
            <img
                src="profile.jpg"
                class="profile"
                alt="Profile"
            >
        </a>

        <div class="icon notification-icon" title="Notifications">
            🔔
        </div>

        <button
            class="icon"
            onclick="toggleDarkMode()"
            id="darkButton"
            title="Dark Mode"
            type="button"
        >🌙</button>

        <div class="icon settings-icon" title="Settings">
            ⚙️
        </div>

    </div>
</div>

<!-- ORIGINAL LAYOUT -->

<div class="container">

    <div class="sidebar">
        <div class="menu">
            <div class="item active">🏠 My BITM</div>
            <div class="item">📊 Dashboard</div>
            <div class="item">📚 Subjects</div>
            <div class="item">📝 Notes Hub</div>
            <div class="item">📂 Resources</div>
        </div>
    </div>

    <div class="main">

        <div class="semester-section" id="semesterSection">
            <h2>Select Semester</h2>

            <div class="semester-buttons">
                <button onclick="showSemester(1,this)">Semester 1</button>
                <button onclick="showSemester(2,this)">Semester 2</button>
                <button onclick="showSemester(3,this)">Semester 3</button>
                <button onclick="showSemester(4,this)">Semester 4</button>
                <button onclick="showSemester(5,this)">Semester 5</button>
                <button onclick="showSemester(6,this)">Semester 6</button>
                <button onclick="showSemester(7,this)">Semester 7</button>
                <button onclick="showSemester(8,this)">Semester 8</button>
            </div>
        </div>

        <div class="chapter-title" id="title">
            Click a semester to view chapters
        </div>

        <div class="chapter-grid" id="chapters"></div>

    </div>
</div>

<!-- MOBILE BOTTOM NAVIGATION -->

<nav class="mobile-bottom-nav" aria-label="Mobile navigation">

    <button
        type="button"
        class="mobile-nav-item active"
        onclick="mobileNavigate('home',this)"
    >
        <span class="nav-icon">🏠</span>
        <span>Home</span>
    </button>

    <button
        type="button"
        class="mobile-nav-item"
        onclick="mobileNavigate('dashboard',this)"
    >
        <span class="nav-icon">📊</span>
        <span>Dashboard</span>
    </button>

    <button
        type="button"
        class="mobile-nav-item"
        onclick="mobileNavigate('subjects',this)"
    >
        <span class="nav-icon">📚</span>
        <span>Subjects</span>
    </button>

    <button
        type="button"
        class="mobile-nav-item"
        onclick="mobileNavigate('notes',this)"
    >
        <span class="nav-icon">📝</span>
        <span>Notes Hub</span>
    </button>

    <button
        type="button"
        class="mobile-nav-item"

    >
        <span class="nav-icon">📂</span>
        <span>Resources</span>
    </button>

    <button
        type="button"
        class="mobile-nav-item"
        id="mobileAuthBtn"
        onclick="handleAuthClick()"
        disabled
    >
        <span class="nav-icon">🔐</span>
        <span id="mobileAuthLabel">Checking...</span>
    </button>

</nav>

<script>
/* SUBJECTS */

const semesters = {
    1:[
        "Foundation of Information Technology",
        "C Programming",
        "English 1",
        "Foundation OF Business Management",
        "Basic Mathematics"
    ],

    2:[
        "Digital Logic",
        "Java Programming",
        "Discrete Structure",
        "Business Communication",
        "OBHRM"
    ],

    3:[
        "Microprocessor And Computer Architecture",
        "Web Technology 1",
        "Data Structure And Algorithms",
        "Financial Accounting",
        "Business Statistics"
    ],

    4:[
        "Web Technology",
        "Database Management System",
        "Business Data Communication And Networking",
        "Operating System",
        "Economics For Business",
        "Cost And Management Accounting"
    ],

    5:[
        "Software Design And Development",
        "Programming With Python",
        "Information Security",
        "Fundamentals Of Marketing",
        "Artificial Intelligence"
    ],

    6:[
        "Business Information System",
        "IT Ethics And Cybersecurity",
        "Fundamentals of Corporate Finance",
        "Business Environment",
        "Business Research Method"
    ],

    7:[
        "E-commerce And Internet Marketing",
        "Sociology For Business Management",
        "Operations Management",
        "Strategic Management"
    ],

    8:[
        "IT Entrepreneurship And Management",
        "Business Intelligence",
        "Digital Economy"
    ]
};

/* SHOW SEMESTER */

function showSemester(sem,btn){
    document.querySelectorAll(".semester-buttons button")
        .forEach(b=>b.classList.remove("active"));

    btn.classList.add("active");

    document.getElementById("title").innerText =
        `Semester ${sem} Subjects`;

    const container=document.getElementById("chapters");
    container.innerHTML="";

    semesters[sem].forEach((subject,index)=>{
        const card=document.createElement("div");
        card.className="chapter-card";
        card.onclick=()=>openSubject(sem,index);

        const number=document.createElement("div");
        number.className="chapter-number";
        number.textContent=`Subject ${index+1}`;

        const name=document.createElement("div");
        name.className="chapter-name";
        name.textContent=subject;

        card.append(number,name);
        container.appendChild(card);
    });
}

/* OPEN SUBJECT */

function openSubject(sem,index){
    window.location.href =
        `subject.html?semester=${sem}&subject=${index}`;
}

/* MOBILE NAVIGATION */

function mobileNavigate(section,btn){
    document.querySelectorAll(".mobile-nav-item")
        .forEach(item=>item.classList.remove("active"));

    btn.classList.add("active");

    if(section==="home"){
        window.scrollTo({top:0,behavior:"smooth"});
    }

    if(section==="subjects"){
        document.getElementById("semesterSection")
            .scrollIntoView({behavior:"smooth",block:"start"});
    }

    /*
      Dashboard, Notes Hub and Resources keep their existing
      menu behavior. Their separate pages/content can be added
      later without changing the desktop layout.
    */
}

/* DARK MODE */

function toggleDarkMode(){
    document.body.classList.toggle("dark-mode");

    const enabled=document.body.classList.contains("dark-mode");
    localStorage.setItem("darkMode",enabled?"enabled":"disabled");

    document.getElementById("darkButton").innerText =
        enabled?"☀️":"🌙";
}

/* LOAD SAVED DARK MODE */

window.addEventListener("DOMContentLoaded",function(){
    const enabled=localStorage.getItem("darkMode")==="enabled";

    document.body.classList.toggle("dark-mode",enabled);
    document.getElementById("darkButton").innerText =
        enabled?"☀️":"🌙";
});
</script>

<!-- FIREBASE LOGIN / LOGOUT -->

<script type="module">
import { initializeApp, getApps, getApp }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

/* YOUR EXISTING FIREBASE PROJECT */

const firebaseConfig = {
    apiKey: "AIzaSyDi2MagVoXj6STUHRg8tCAp53RuoFsTN2M",
    authDomain: "my-bitm-notes.firebaseapp.com",
    projectId: "my-bitm-notes",
    storageBucket: "my-bitm-notes.firebasestorage.app",
    messagingSenderId: "806626631556",
    appId: "1:806626631556:web:3e1ff6d9474580fc5e47d1",
    measurementId: "G-RYR93GQ15R"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const auth = getAuth(app);

const authBtn = document.getElementById("authBtn");
const mobileAuthBtn = document.getElementById("mobileAuthBtn");
const mobileAuthLabel = document.getElementById("mobileAuthLabel");

let authReady = false;

onAuthStateChanged(auth,(user)=>{
    authReady = true;

    const label = user ? "Logout" : "Login";
    const title = user
        ? "Sign out of your account"
        : "Sign in to your account";

    authBtn.disabled = false;
    authBtn.textContent = label;
    authBtn.title = title;

    mobileAuthBtn.disabled = false;
    mobileAuthLabel.textContent = label;
    mobileAuthBtn.title = title;
});

window.handleAuthClick = async function(){
    if(!authReady){
        return;
    }

    authBtn.disabled = true;
    mobileAuthBtn.disabled = true;

    try{
        if(auth.currentUser){
            await signOut(auth);
            window.location.href = "index.html";
        }else{
            window.location.href = "login.html";
        }
    }catch(error){
        console.error("Authentication action failed:",error);
        alert("Unable to log out. Please try again.");

        const label = auth.currentUser ? "Logout" : "Login";

        authBtn.disabled = false;
        authBtn.textContent = label;

        mobileAuthBtn.disabled = false;
        mobileAuthLabel.textContent = label;
    }
};
</script>

</body>
</html>
