<!DOCTYPE html>
<html>
<head>
    <title>Ashmin Notes</title>
    <style>
        body{
            font-family: Arial;
            background:#f5f5f5;
            margin:0;
            padding:20px;
            text-align:center;
        }
        h1{
            color:#2c3e50;
        }
        .search{
            margin:20px;
        }
        input{
            width:300px;
            padding:10px;
            border-radius:8px;
            border:1px solid #ccc;
        }
        .grid{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:15px;
            max-width:800px;
            margin:auto;
        }
        .box{
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
            cursor:pointer;
        }
        .box:hover{
            background:#eaf2ff;
        }
    </style>
</head>
<body>

    <h1>Ashmin Notes</h1>

    <div class="search">
        <input type="text" placeholder="Search notes...">
    </div>

    <h2>BITM</h2>

    <div class="grid">
        <div class="box">1st Semester</div>
        <div class="box">2nd Semester</div>
        <div class="box">3rd Semester</div>
        <div class="box">4th Semester</div>
        <div class="box">5th Semester</div>
        <div class="box">6th Semester</div>
        <div class="box">7th Semester</div>
        <div class="box">8th Semester</div>
    </div>

</body>
</html>
