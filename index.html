
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My BITM Notes</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{
    background:#f4f7fb;
    color:#111827;
    transition:0.3s;
}

/* HEADER - ORIGINAL PC DESIGN */

.header{
    background:#F7FBFF;
    padding:14px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    box-shadow:0 2px 12px rgba(0,0,0,0.08);
    position:sticky;
    top:0;
    z-index:100;
    transition:0.3s;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:190px;
}

.logo-icon{
    width:46px;
    height:46px;
    border-radius:12px;
    background:#0b4db8;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}

.logo-text h1{
    font-size:22px;
    color:#0b4db8;
    line-height:1;
}

.logo-text span{
    font-size:14px;
    color:#6b7280;
}

.search-box{
    flex:1;
    max-width:650px;
    background:#f4f7fb;
    border:1px solid #dbe3f0;
    border-radius:999px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 18px;
    transition:0.3s;
}

.search-box span{
    color:#6b7280;
    font-size:18px;
}

.search-box input{
    border:none;
    outline:none;
    background:transparent;
    width:100%;
    font-size:15px;
    color:#111827;
}

.actions{
    display:flex;
    align-items:center;
    gap:12px;
}

.profile{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #e5e7eb;
    display:block;
}

.icon{
    width:40px;
    height:40px;
    flex-shrink:0;
    border-radius:50%;
    background:#f4f7fb;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:0.2s;
    font-size:18px;
    border:none;
    text-decoration:none;
    color:inherit;
}

.icon:hover{
    background:#e8f0fe;
}

/* LOGIN / LOGOUT BUTTON */

.auth-btn{
    padding:10px 17px;
    border:none;
    border-radius:10px;
    background:#0b4db8;
    color:white;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:0.2s;
}

.auth-btn:hover{
    background:#083c91;
}

.auth-btn:disabled{
    opacity:0.6;
    cursor:wait;
}

/* MOBILE BOTTOM NAVIGATION - HIDDEN ON PC */

.mobile-bottom-nav{
    display:none;
}

/* LAYOUT */

.container{
    display:flex;
    min-height:calc(100vh - 80px);
}

/* SIDEBAR */

.sidebar{
    width:230px;
    flex-shrink:0;
    background:#ffffff;
    padding:22px 18px;
    box-shadow:2px 0 10px rgba(0,0,0,0.05);
    transition:0.3s;
}

.sidebar .menu{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.menu .item{
    padding:13px 15px;
    border-radius:12px;
    cursor:pointer;
    transition:0.2s;
    font-weight:500;
}

.menu .item.active{
    background:#0b4db8;
    color:white;
}

.menu .item:hover{
    background:#e8f0fe;
}

.menu .item.active:hover{
    background:#0a44a3;
}

/* MAIN CONTENT */

.main{
    flex:1;
    min-width:0;
    padding:26px;
}

.semester-section{
    background:#0b4db8;
    border-radius:22px;
    padding:24px;
    margin-bottom:28px;
}

.semester-section h2{
    color:white;
    margin-bottom:18px;
    font-size:24px;
}

.semester-buttons{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:14px;
}

.semester-buttons button{
    padding:13px 14px;
    border:none;
    border-radius:14px;
    background:white;
    color:#111827;
    font-weight:700;
    cursor:pointer;
    transition:0.2s;
}

.semester-buttons button:hover{
    background:#dbeafe;
}

.semester-buttons button.active{
    background:#0b4db8;
    color:white;
    border:2px solid white;
}

.chapter-title{
    font-size:24px;
    color:#0b4db8;
    margin-bottom:22px;
    font-weight:700;
}

.chapter-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:20px;
}

.chapter-card{
    background:white;
    border-radius:18px;
    padding:22px;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
    border-left:6px solid #0b4db8;
    transition:0.2s;
    cursor:pointer;
}

.chapter-card:hover{
    transform:translateY(-3px);
    background:#f8fbff;
}

.chapter-number{
    font-size:14px;
    font-weight:700;
    color:#0b4db8;
    margin-bottom:10px;
}

.chapter-name{
    font-size:18px;
    font-weight:700;
    line-height:1.4;
}

/* DARK MODE */

body.dark-mode{
    background:#111827;
    color:#f9fafb;
}

body.dark-mode .header{
    background:#1f2937;
    box-shadow:0 2px 12px rgba(0,0,0,0.3);
}

body.dark-mode .logo-text h1{
    color:#60a5fa;
}

body.dark-mode .logo-text span{
    color:#9ca3af;
}

body.dark-mode .search-box{
    background:#374151;
    border-color:#4b5563;
}

body.dark-mode .search-box input{
    color:white;
}

body.dark-mode .search-box input::placeholder{
    color:#9ca3af;
}

body.dark-mode .search-box span{
    color:#d1d5db;
}

body.dark-mode .icon{
    background:#374151;
    color:white;
}

body.dark-mode .icon:hover{
    background:#4b5563;
}

body.dark-mode .profile{
    border-color:#4b5563;
}

body.dark-mode .sidebar{
    background:#1f2937;
    box-shadow:2px 0 10px rgba(0,0,0,0.3);
}

body.dark-mode .menu .item{
    color:#f9fafb;
}

body.dark-mode .menu .item:hover{
    background:#374151;
}

body.dark-mode .menu .item.active{
    background:#0b4db8;
    color:white;
}

body.dark-mode .chapter-title{
    color:#60a5fa;
}

body.dark-mode .chapter-card{
    background:#1f2937;
    color:#f9fafb;
    box-shadow:0 6px 18px rgba(0,0,0,0.3);
}

body.dark-mode .chapter-card:hover{
    background:#273449;
}

body.dark-mode .chapter-number{
    color:#60a5fa;
}

body.dark-mode .chapter-name{
    color:#f9fafb;
}

/* TABLET - ORIGINAL LAYOUT */

@media(max-width:900px){
    .container{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        padding:14px;
    }

    .sidebar .menu{
        flex-direction:row;
        flex-wrap:wrap;
    }

    .menu .item{
        padding:10px 12px;
    }
}

/* MOBILE-ONLY CHANGES */

@media(max-width:700px){

    /* Top row: logo | search | profile */

    .header{
        display:grid;
        grid-template-columns:auto minmax(0,1fr) auto;
        align-items:center;
        gap:10px;
        padding:12px;
    }

    .logo{
        min-width:0;
        gap:8px;
    }

    .logo-icon{
        width:38px;
        height:38px;
        font-size:21px;
        flex-shrink:0;
    }

    .logo-text h1{
        font-size:17px;
    }

    .logo-text span{
        font-size:12px;
    }

    .search-box{
        order:initial;
        width:100%;
        min-width:0;
        max-width:none;
        gap:6px;
        padding:10px;
    }

    .search-box span{
        font-size:15px;
    }

    .search-box input{
        min-width:0;
        font-size:12px;
    }

    /* Keep only the profile photo in the top-right */

    .actions{
        display:flex;
        justify-content:flex-end;
        gap:0;
        min-width:0;
    }

    .actions > #authBtn,
    .actions > .icon{
        display:none;
    }

    .actions > a{
        display:block;
        flex-shrink:0;
    }

    .profile{
        width:36px;
        height:36px;
    }

    /* Bottom bar: original icons and login button */

    .mobile-bottom-nav{
        display:flex;
        position:fixed;
        left:0;
        right:0;
        bottom:0;
        z-index:1000;
        align-items:center;
        justify-content:space-around;
        gap:6px;
        padding:9px 8px;
        padding-bottom:max(9px, env(safe-area-inset-bottom));
        background:#F7FBFF;
        border-top:1px solid #dbe3f0;
        box-shadow:0 -3px 12px rgba(0,0,0,0.08);
    }

    .mobile-bottom-nav .icon{
        width:40px;
        height:40px;
        flex-shrink:0;
        font-size:18px;
        background:#f4f7fb;
    }

    .mobile-bottom-nav .auth-btn{
        padding:9px 12px;
        font-size:13px;
        border-radius:10px;
    }

    body.dark-mode .mobile-bottom-nav{
        background:#1f2937;
        border-top-color:#374151;
        box-shadow:0 -3px 12px rgba(0,0,0,0.3);
    }

    body.dark-mode .mobile-bottom-nav .icon{
        background:#374151;
        color:white;
    }

    body.dark-mode .mobile-bottom-nav .icon:hover{
        background:#4b5563;
    }

    /* Keep page content clear of the fixed bottom bar */

    .main{
        padding:18px;
        padding-bottom:95px;
    }

    .semester-section{
        padding:18px;
    }
}

@media(max-width:420px){
    .header{
        gap:7px;
        padding:10px 8px;
    }

    .logo{
        gap:6px;
    }

    .logo-icon{
        width:34px;
        height:34px;
        font-size:19px;
    }

    .logo-text h1{
        font-size:15px;
    }

    .logo-text span{
        font-size:11px;
    }

    .search-box{
        padding:9px 7px;
        gap:4px;
    }

    .search-box input{
        font-size:11px;
    }

    .profile{
        width:33px;
        height:33px;
    }

    .mobile-bottom-nav{
        gap:3px;
        padding-left:5px;
        padding-right:5px;
    }

    .mobile-bottom-nav .icon{
        width:36px;
        height:36px;
        font-size:17px;
    }

    .mobile-bottom-nav .auth-btn{
        padding:8px 9px;
        font-size:12px;
    }

    .semester-buttons{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }
}
</style>

</head>

<body>

<!-- HEADER -->

<div class="header">

    <div class="logo">
        <div class="logo-icon">📘</div>

        <div class="logo-text">
            <h1>My BITM</h1>
            <span>Notes</span>
        </div>
    </div>

    <div class="search-box">
        <span>🔍</span>
        <input
            type="text"
            placeholder="Search for chapters, subjects, or keywords..."
        >
    </div>

    <div class="actions">

        <!-- PC LOGIN / LOGOUT BUTTON -->

        <button
            id="authBtn"
            class="auth-btn"
            type="button"
            onclick="handleAuthClick()"
            disabled
        >Checking...</button>

        <!-- PROFILE PHOTO -->

        <a href="profile.html">
            <img
                src="profile.jpg"
                class="profile"
                alt="Profile"
            >
        </a>

        <!-- ORIGINAL PC ICONS -->

        <div class="icon" title="Notifications">
            🔔
        </div>

        <div
            class="icon"
            onclick="toggleDarkMode()"
            id="darkButton"
            title="Dark Mode"
        >🌙</div>

        <div class="icon" title="Settings">
            ⚙️
        </div>

    </div>
</div>

<!-- MOBILE BOTTOM NAVIGATION -->

<div class="mobile-bottom-nav">

    <div class="icon" title="Notifications">
        🔔
    </div>

    <div class="icon" title="Settings">
        ⚙️
    </div>

    <button
        id="mobileAuthBtn"
        class="auth-btn"
        type="button"
        onclick="handleAuthClick()"
        disabled
    >Checking...</button>

    <div
        class="icon"
        onclick="toggleDarkMode()"
        id="mobileDarkButton"
        title="Dark Mode"
    >🌙</div>

</div>

<!-- LAYOUT -->

<div class="container">

    <div class="sidebar">
        <div class="menu">
            <div class="item active">🏠 My BITM</div>
            <div class="item">📊 Dashboard</div>
            <div class="item">📚 Subjects</div>
            <div class="item">📝 Notes Hub</div>
            <div class="item">📂 Resources</div>
        </div>
    </div>

    <div class="main">

        <div class="semester-section">
            <h2>Select Semester</h2>

            <div class="semester-buttons">
                <button onclick="showSemester(1,this)">Semester 1</button>
                <button onclick="showSemester(2,this)">Semester 2</button>
                <button onclick="showSemester(3,this)">Semester 3</button>
                <button onclick="showSemester(4,this)">Semester 4</button>
                <button onclick="showSemester(5,this)">Semester 5</button>
                <button onclick="showSemester(6,this)">Semester 6</button>
                <button onclick="showSemester(7,this)">Semester 7</button>
                <button onclick="showSemester(8,this)">Semester 8</button>
            </div>
        </div>

        <div class="chapter-title" id="title">
            Click a semester to view chapters
        </div>

        <div class="chapter-grid" id="chapters"></div>

    </div>
</div>

<script>
/* SUBJECTS */

const semesters = {
    1:[
        "Foundation of Information Technology",
        "C Programming",
        "English 1",
        "Foundation OF Business Management",
        "Basic Mathematics"
    ],

    2:[
        "Digital Logic",
        "Java Programming",
        "Discrete Structure",
        "Business Communication",
        "OBHRM"
    ],

    3:[
        "Microprocessor And Computer Architecture",
        "Web Technology 1",
        "Data Structure And Algorithms",
        "Financial Accounting",
        "Business Statistics"
    ],

    4:[
        "Web Technology",
        "Database Management System",
        "Business Data Communication And Networking",
        "Operating System",
        "Economics For Business",
        "Cost And Management Accounting"
    ],

    5:[
        "Software Design And Development",
        "Programming With Python",
        "Information Security",
        "Fundamentals Of Marketing",
        "Artificial Intelligence"
    ],

    6:[
        "Business Information System",
        "IT Ethics And Cybersecurity",
        "Fundamentals of Corporate Finance",
        "Business Environment",
        "Business Research Method"
    ],

    7:[
        "E-commerce And Internet Marketing",
        "Sociology For Business Management",
        "Operations Management",
        "Strategic Management"
    ],

    8:[
        "IT Entrepreneurship And Management",
        "Business Intelligence",
        "Digital Economy"
    ]
};

/* SHOW SEMESTER */

function showSemester(sem,btn){
    document.querySelectorAll(".semester-buttons button")
        .forEach(b=>b.classList.remove("active"));

    btn.classList.add("active");

    document.getElementById("title").innerText =
        `Semester ${sem} Subjects`;

    const container=document.getElementById("chapters");
    container.innerHTML="";

    semesters[sem].forEach((subject,index)=>{
        const card=document.createElement("div");
        card.className="chapter-card";
        card.onclick=()=>openSubject(sem,index);

        const number=document.createElement("div");
        number.className="chapter-number";
        number.textContent=`Subject ${index+1}`;

        const name=document.createElement("div");
        name.className="chapter-name";
        name.textContent=subject;

        card.append(number,name);
        container.appendChild(card);
    });
}

/* OPEN SUBJECT */

function openSubject(sem,index){
    window.location.href =
        `subject.html?semester=${sem}&subject=${index}`;
}

/* DARK MODE */

function toggleDarkMode(){
    document.body.classList.toggle("dark-mode");

    const enabled=document.body.classList.contains("dark-mode");

    localStorage.setItem(
        "darkMode",
        enabled ? "enabled" : "disabled"
    );

    updateDarkIcons();
}

/* UPDATE BOTH DARK MODE ICONS */

function updateDarkIcons(){
    const enabled =
        document.body.classList.contains("dark-mode");

    const icon = enabled ? "☀️" : "🌙";

    document.getElementById("darkButton").innerText = icon;
    document.getElementById("mobileDarkButton").innerText = icon;
}

/* LOAD SAVED DARK MODE */

window.addEventListener("DOMContentLoaded",function(){
    const enabled =
        localStorage.getItem("darkMode")==="enabled";

    document.body.classList.toggle("dark-mode",enabled);
    updateDarkIcons();
});
</script>

<!-- FIREBASE LOGIN / LOGOUT -->


<script type="module">
import { initializeApp, getApps, getApp }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyDi2MagVoXj6STUHRg8tCAp53RuoFsTN2M",
    authDomain: "my-bitm-notes.firebaseapp.com",
    projectId: "my-bitm-notes",
    storageBucket: "my-bitm-notes.firebasestorage.app",
    messagingSenderId: "806626631556",
    appId: "1:806626631556:web:3e1ff6d9474580fc5e47d1",
    measurementId: "G-RYR93GQ15R"
};

const app = getApps().length
    ? getApp()
    : initializeApp(firebaseConfig);

const auth = getAuth(app);

const authButtons = [
    document.getElementById("authBtn"),
    document.getElementById("mobileAuthBtn")
];

let authReady = false;

function updateButtons(user) {
    authButtons.forEach(button => {
        if (!button) return;

        button.textContent = user ? "Logout" : "Login";
        button.disabled = false;
    });
}

onAuthStateChanged(auth, user => {
    authReady = true;
    updateButtons(user);
});

window.handleAuthClick = async function() {
    if (!authReady) return;

    authButtons.forEach(button => {
        if (button) button.disabled = true;
    });

    try {
        if (auth.currentUser) {
            await signOut(auth);

            updateButtons(null);

            window.location.href = "login.html";
        } else {
            window.location.href = "login.html";
        }
    } catch (error) {
        console.error("Login/logout error:", error);
        alert("Unable to log out. Please try again.");
        updateButtons(auth.currentUser);
    }
};
</script>


</body>
</html>
