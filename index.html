<!DOCTYPE html>
<html>
<head>
    <title>Ashmin Notes</title>
    <style>
        body{
            font-family: Arial;
            background:yellow;
            margin:0;
            padding:20px;
            text-align:center;
        }
        h1{
            color:#2c3e50;
        }
        .search{
            margin:20px;
        }
        input{
            width:300px;
            padding:10px;
            border-radius:8px;
            border:1px solid #ccc;
        }
        .grid{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:15px;
            max-width:800px;
            margin:auto;
        }
        .box{
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
            cursor:pointer;
        }
        .box:hover{
            background:#eaf2ff;
        }
        .profile{ position:absolute; top:15px; right:15px; }
        .profile img{  width:50px;
                     height:50px;
                     border-radius:50%;
                     object-fit:cover;
                     border:2px solid white;
                     box-shadow:0 2px 6px rgba(0,0,0,0.2);
                     cursor:pointer;
                    }
        .box-link{ text-decoration:none; color:inherit; }
    </style>
</head>
<body>
    <div class="profile"> <a href="about.html"> <img src="profile.jpg" alt="Profile"> </a> </div>

    <h1>Ashmin Notes</h1>

    <div class="search">
        <input type="text" placeholder="Search notes...">
    </div>

    <h2>BITM</h2>

    <div class="grid">
       <a href="semester1.html" class="box-link">
           <div class="box">1st Semester</div> 
       </a>
        <div class="box">2nd Semester</div>
        <div class="box">3rd Semester</div>
        <div class="box">4th Semester</div>
        <div class="box">5th Semester</div>
        <div class="box">6th Semester</div>
        <div class="box">7th Semester</div>
        <div class="box">8th Semester</div>
    </div>

</body>
</html>
