
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My BITM Notes</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: #f4f7fb;
    color: #111827;
    transition: 0.3s;
}

.header {
    background: #F7FBFF;
    padding: 14px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 190px;
}

.logo-icon {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: #0b4db8;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
}

.logo-text h1 {
    font-size: 22px;
    color: #0b4db8;
    line-height: 1;
}

.logo-text span {
    font-size: 14px;
    color: #6b7280;
}

.search-box {
    flex: 1;
    max-width: 650px;
    background: #f4f7fb;
    border: 1px solid #dbe3f0;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
}

.search-box span {
    color: #6b7280;
    font-size: 18px;
}

.search-box input {
    border: none;
    outline: none;
    background: transparent;
    width: 100%;
    font-size: 15px;
    color: inherit;
}

.actions {
    display: flex;
    align-items: center;
    gap: 14px;
}

.profile {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #e5e7eb;
}

.icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #f4f7fb;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
}

.icon:hover {
    background: #e8f0fe;
}

.main {
    max-width: 1200px;
    margin: auto;
    padding: 30px;
}

.back-button {
    display: inline-block;
    margin-bottom: 25px;
    padding: 10px 18px;
    background: #0b4db8;
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-weight: 600;
}

.back-button:hover {
    background: #0a44a3;
}

.subject-header {
    background: #0b4db8;
    color: white;
    border-radius: 22px;
    padding: 30px;
    margin-bottom: 30px;
}

.subject-header h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.subject-header p {
    font-size: 16px;
    opacity: 0.9;
}

.chapter-title {
    font-size: 24px;
    color: #0b4db8;
    margin-bottom: 20px;
    font-weight: 700;
}

.chapter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
}

.chapter-card {
    background: white;
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    border-left: 6px solid #0b4db8;
    transition: 0.2s;
    min-width: 0;
}

.chapter-card:hover {
    transform: translateY(-3px);
    background: #f8fbff;
}

.chapter-number {
    font-size: 14px;
    font-weight: 700;
    color: #0b4db8;
    margin-bottom: 10px;
}

.chapter-name {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 16px;
}

.chapter-options {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.pdf-button,
.admin-add-button {
    display: inline-block;
    padding: 10px 14px;
    border: none;
    border-radius: 9px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    text-decoration: none;
}

.pdf-button {
    background: #e8f0fe;
    color: #0b4db8;
}

.pdf-button:hover {
    background: #dbeafe;
}

.admin-add-button {
    background: #0b4db8;
    color: white;
}

.admin-add-button:hover {
    background: #0a44a3;
}

.saved-pdfs {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 14px;
}

.saved-pdf {
    display: block;
    padding: 10px 12px;
    background: #f0f7ff;
    color: #0b4db8;
    border-radius: 9px;
    text-decoration: none;
    overflow-wrap: anywhere;
    font-weight: 600;
    font-size: 14px;
}

.saved-pdf:hover {
    background: #dbeafe;
}

.pdf-status {
    margin-top: 12px;
    color: #6b7280;
    font-size: 13px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.login-link {
    display: inline-block;
    margin-top: 10px;
    padding: 9px 14px;
    background: #0b4db8;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
}

body.dark-mode {
    background: #111827;
    color: #f9fafb;
}

body.dark-mode .header {
    background: #1f2937;
    box-shadow: 0 2px 12px rgba(0,0,0,0.35);
}

body.dark-mode .logo-text h1 {
    color: #60a5fa;
}

body.dark-mode .logo-text span {
    color: #9ca3af;
}

body.dark-mode .search-box {
    background: #374151;
    border-color: #4b5563;
}

body.dark-mode .search-box span {
    color: #d1d5db;
}

body.dark-mode .search-box input {
    color: white;
}

body.dark-mode .search-box input::placeholder {
    color: #9ca3af;
}

body.dark-mode .icon {
    background: #374151;
}

body.dark-mode .icon:hover {
    background: #4b5563;
}

body.dark-mode .profile {
    border-color: #4b5563;
}

body.dark-mode .chapter-title {
    color: #60a5fa;
}

body.dark-mode .chapter-card {
    background: #1f2937;
    color: #f9fafb;
    border-left-color: #3b82f6;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
}

body.dark-mode .chapter-card:hover {
    background: #263449;
}

body.dark-mode .chapter-number {
    color: #60a5fa;
}

body.dark-mode .chapter-name {
    color: #f9fafb;
}

body.dark-mode .pdf-button,
body.dark-mode .saved-pdf {
    background: #263b5c;
    color: #93c5fd;
}

body.dark-mode .pdf-button:hover,
body.dark-mode .saved-pdf:hover {
    background: #334b70;
}

body.dark-mode .admin-add-button,
body.dark-mode .login-link {
    background: #2563eb;
    color: white;
}

body.dark-mode .pdf-status {
    color: #9ca3af;
}

@media(max-width: 700px) {
    .header {
        flex-wrap: wrap;
    }

    .search-box {
        order: 3;
        width: 100%;
        max-width: none;
    }

    .main {
        padding: 18px;
    }

    .subject-header {
        padding: 22px;
    }

    .subject-header h1 {
        font-size: 24px;
    }

    .chapter-options {
        flex-direction: column;
    }

    .pdf-button,
    .admin-add-button {
        text-align: center;
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">
        <div class="logo-icon">📘</div>
        <div class="logo-text">
            <h1>My BITM</h1>
            <span>Notes</span>
        </div>
    </div>

    <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Search chapters...">
    </div>

    <div class="actions">
        <a href="profile.html">
            <img src="profile.jpg" class="profile" alt="Profile">
        </a>
        <div class="icon" title="Notifications">🔔</div>
        <div class="icon" id="darkModeButton" title="Dark Mode">🌙</div>
    </div>
</div>

<div class="main">
    <a href="index.html" class="back-button">← Back to My BITM</a>

    <div class="subject-header">
        <h1 id="subjectName">Subject</h1>
        <p id="semesterName">Semester • BITM</p>
    </div>

    <div class="chapter-title">Chapters</div>
    <div class="chapter-grid" id="chapterGrid"></div>
    <p class="pdf-status" id="pageStatus" role="status" aria-live="polite">
        Checking login status...
    </p>
    <div id="loginAction"></div>
</div>

<script type="module">
import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    serverTimestamp
} from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

import {
    getAuth,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence
} from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

/* FIREBASE CONFIGURATION */

const firebaseConfig = {
  apiKey: "AIzaSyDi2MagVoXj6STUHRg8tCAp53rUofsTN2M",
  authDomain: "my-bitm-notes.firebaseapp.com",
  projectId: "my-bitm-notes",
  storageBucket: "my-bitm-notes.firebasestorage.app",
  messagingSenderId: "806626631556",
  appId: "1:806626631556:web:3e1ff6d9474580fc5e47d1",
  measurementId: "G-RYR93GQ15R"
};

const ADMIN_UID = "DL3vp2hyOXeIgAyd3lvkK7vIF1z1";
const UPLOAD_FUNCTION_URL =
    "https://alwoegbhtotladrtaouk.supabase.co/functions/v1/upload-pdf";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const params = new URLSearchParams(location.search);
const semester = params.get("semester");
const subjectIndex = params.get("subject");

const subjects = {
    1: [
        "Foundation of Information Technology",
        "C Programming",
        "English 1",
        "Foundation of Business Management",
        "Basic Mathematics",
        "Assignment"
    ],
    2: [
        "Digital Logic",
        "Java Programming",
        "Discrete Structure",
        "Business Communication",
        "OBHRM",
        "Assignment"
    ],
    3: [
        "Microprocessor And Computer Architecture",
        "Web Technology 1",
        "Data Structure And Algorithms",
        "Financial Accounting",
        "Business Statistics",
        "Assignment"
    ],
    4: [
        "Web Technology",
        "Database Management System",
        "Business Data Communication And Networking",
        "Operating System",
        "Economics For Business",
        "Cost And Management Accounting"
    ],
    5: [
        "Software Design And Development",
        "Programming With Python",
        "Information Security",
        "Fundamentals Of Marketing",
        "Artificial Intelligence",
        "Assignment"
    ],
    6: [
        "Business Information System",
        "IT Ethics And Cybersecurity",
        "Fundamentals of Corporate Finance",
        "Business Environment",
        "Business Research Method",
        "Assignment"
    ],
    7: [
        "E-commerce And Internet Marketing",
        "Sociology For Business Management",
        "Operations Management",
        "Strategic Management",
        "Internship",
        "Project/Assignment"
    ],
    8: [
        "IT Entrepreneurship And Management",
        "Business Intelligence",
        "Digital Economy",
        "Project",
        "Project",
        "Project"
    ]
};

const chapters = {
    "1-1": [
        "Introduction to Programming Language",
        "Basic Elements of C",
        "Data Input and Output",
        "Operators",
        "Control Statements",
        "Functions, Arrays and Strings",
        "Pointers",
        "Structures and Unions",
        "Preprocessor in C",
        "File Handling",
        "Graphics Programming in C"
    ],
    "1-2": [
        "Cross-Cultural Communication",
        "Mass Media, Information, and Technology",
        "Issues of Ethics",
        "Tradition, Progress, and Development",
        "Self, Reflection, and Experience",
        "Observation, Change, and Description"
    ],
    "1-3": [
        "Introduction to Business and Management",
        "Planning, Decision Making and Problem Solving",
        "Organizing",
        "Leadership",
        "Controlling",
        "Ethics, Social Responsibility and Contemporary Issues"
    ],
    "1-4": [
        "Set Theory and Real Number",
        "Complex Number",
        "Function, Limit and Continuity",
        "Differential and Its Application",
        "Integration and Its Application",
        "Differential Equation",
        "Vector",
        "Matrix and Determinant",
        "Least Square Method"
    ],
    "1-0": [
        "IT Computer Fundamentals",
        "Hardware and Peripherals",
        "Software",
        "Fundamental Concepts of Data Management",
        "Networking and Internet",
        "Multimedia",
        "Introduction to IT and Information Systems",
        "Cybersecurity",
        "IT Ethics",
        "Emerging Technologies and Digital Transformation"
    ]
};

const subjectName = subjects[semester]?.[subjectIndex];
const chapterGrid = document.getElementById("chapterGrid");
const pageStatus = document.getElementById("pageStatus");
const loginAction = document.getElementById("loginAction");
const searchInput = document.getElementById("searchInput");
const darkModeButton = document.getElementById("darkModeButton");

let isAdmin = false;
let savedNotes = [];

if (!subjectName) {
    document.getElementById("subjectName").textContent = "Subject not found";
    document.getElementById("semesterName").textContent = "";
    pageStatus.textContent =
        "Please return to the main page and select a subject.";
    throw new Error("Invalid semester or subject selection.");
}

document.getElementById("subjectName").textContent = subjectName;
document.getElementById("semesterName").textContent =
    `Semester ${semester} • BITM`;

/* PDF LINK VALIDATION */

function isValidPdfLink(value) {
    try {
        const url = new URL(value);

        if (url.protocol !== "https:") return false;

        const isGoogleDrive =
            url.hostname === "drive.google.com" ||
            url.hostname === "docs.google.com";

        const isSupabasePdf =
            url.hostname === "alwoegbhtotladrtaouk.supabase.co" &&
            url.pathname.startsWith(
                "/storage/v1/object/public/bitm-pdfs/"
            ) &&
            url.pathname.toLowerCase().endsWith(".pdf");

        return isGoogleDrive || isSupabasePdf;
    } catch {
        return false;
    }
}

/* CHAPTER NOTES */

function getChapterNotes(chapterNumber) {
    return savedNotes.filter(note =>
        note.semester === `Semester ${semester}` &&
        note.subject === subjectName &&
        note.chapter === chapterNumber
    );
}

function makePdfLink(note) {
    const link = document.createElement("a");
    link.className = "saved-pdf";
    link.href = note.pdfLink;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent =
        `${note.type || "PDF"}: ${note.title || "Open PDF"}`;
    return link;
}

/* UPLOAD PDF */



async function addPdfToChapter(chapterNumber) {
    const user = auth.currentUser;

    if (!user || user.uid !== ADMIN_UID) {
        alert("You are not signed in with the authorized admin account.");
        return;
    }

    const oldForm = document.getElementById("pdf-upload-form");
    if (oldForm) oldForm.remove();

    const form = document.createElement("div");
    form.id = "pdf-upload-form";
    form.style.cssText = `
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: rgba(0,0,0,0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
    `;

    form.innerHTML = `
        <div style="
            background: var(--card-bg, white);
            color: var(--text-color, #111827);
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        ">
            <h3 style="margin-top:0">Upload PDF</h3>

            <label for="pdf-title">PDF Title</label>
            <input id="pdf-title" type="text"
                placeholder="Enter PDF title"
                style="width:100%;padding:10px;margin:8px 0 16px;box-sizing:border-box">

            <label for="pdf-type">Content Type</label>
            <select id="pdf-type"
                style="width:100%;padding:10px;margin:8px 0 16px;box-sizing:border-box">
                <option value="Syllabus">Syllabus</option>
                <option value="Assignment">Assignment</option>
            </select>

            <label for="pdf-file">Choose PDF</label>
            <input id="pdf-file" type="file"
                accept=".pdf,application/pdf"
                style="display:block;width:100%;margin:8px 0 20px">

            <div style="display:flex;gap:10px">
                <button id="pdf-cancel" type="button"
                    style="flex:1;padding:10px;cursor:pointer">Cancel</button>
                <button id="pdf-submit" type="button"
                    style="flex:1;padding:10px;cursor:pointer">Upload</button>
            </div>

            <p id="pdf-form-status" role="status"></p>
        </div>
    `;

    document.body.appendChild(form);

    const titleInput = form.querySelector("#pdf-title");
    const typeInput = form.querySelector("#pdf-type");
    const fileInput = form.querySelector("#pdf-file");
    const submitButton = form.querySelector("#pdf-submit");
    const status = form.querySelector("#pdf-form-status");

    form.querySelector("#pdf-cancel").onclick = () => form.remove();

    submitButton.onclick = async () => {
        const title = titleInput.value.trim();
        const type = typeInput.value;
        const file = fileInput.files[0];

        if (!title) {
            status.textContent = "Please enter a PDF title.";
            titleInput.focus();
            return;
        }

        if (!file) {
            status.textContent = "Please choose a PDF file.";
            return;
        }

        if (
            file.type !== "application/pdf" ||
            !file.name.toLowerCase().endsWith(".pdf")
        ) {
            status.textContent = "Please select a PDF file.";
            return;
        }

        if (file.size === 0 || file.size > 50 * 1024 * 1024) {
            status.textContent = "Choose a PDF smaller than 50 MB.";
            return;
        }

        submitButton.disabled = true;
        status.textContent = "Uploading PDF... Please wait.";

        try {
            const token = await user.getIdToken();
            const formData = new FormData();
            formData.append("file", file);

            const response = await fetch(UPLOAD_FUNCTION_URL, {
                method: "POST",
                headers: {
                    Authorization: `Bearer ${token}`
                },
                body: formData
            });

            const result = await response.json();

            if (!response.ok || !result.success || !result.pdfLink) {
                throw new Error(result.error || "PDF upload failed.");
            }

            if (!isValidPdfLink(result.pdfLink)) {
                throw new Error("The storage service returned an invalid PDF link.");
            }

            status.textContent = "Saving PDF information...";

            await addDoc(collection(db, "notes"), {
                semester: `Semester ${semester}`,
                subject: subjectName,
                chapter: chapterNumber,
                type: type,
                title: title,
                pdfLink: result.pdfLink,
                storagePath: result.path || "",
                createdAt: serverTimestamp()
            });

            await loadNotes();
            form.remove();
            pageStatus.textContent = "PDF uploaded and saved successfully!";
        } catch (error) {
            console.error("PDF upload error:", error);
            status.textContent = "Upload failed: " + error.message;
            submitButton.disabled = false;
        }
    };

    titleInput.focus();
}


/* SEARCH */

function applySearch() {
    const search = searchInput.value.toLowerCase();

    document.querySelectorAll(".chapter-card").forEach(card => {
        card.style.display =
            card.innerText.toLowerCase().includes(search) ? "" : "none";
    });
}

searchInput.addEventListener("input", applySearch);

/* SHARED DARK MODE */

function applyDarkMode() {
    const enabled = localStorage.getItem("darkMode") === "enabled";
    document.body.classList.toggle("dark-mode", enabled);
    darkModeButton.textContent = enabled ? "☀️" : "🌙";
}

applyDarkMode();

darkModeButton.addEventListener("click", () => {
    const enabled = !document.body.classList.contains("dark-mode");

    localStorage.setItem(
        "darkMode",
        enabled ? "enabled" : "disabled"
    );

    applyDarkMode();
});

/* FIREBASE LOGIN AND ADMIN STATUS */

function showLoginLink() {
    loginAction.replaceChildren();

    const link = document.createElement("a");
    link.className = "login-link";
    link.href = "login.html";
    link.textContent = "Go to Login";

    loginAction.appendChild(link);
}

async function startPage() {
    pageStatus.textContent = "Checking Firebase login...";

    try {
        /*
         * This sets browser-local persistence for this page.
         * The login page must also successfully sign in to
         * the same Firebase project.
         */
        await setPersistence(auth, browserLocalPersistence);

        onAuthStateChanged(auth, async user => {
            loginAction.replaceChildren();

            isAdmin = !!user && user.uid === ADMIN_UID;

            renderChapters();

            if (!user) {
                pageStatus.textContent =
                    "Not logged in. Please sign in first.";
                showLoginLink();
            } else if (!isAdmin) {
                pageStatus.textContent =
                    "Signed in, but this account is not the authorized admin. " +
                    "Current UID: " + user.uid;
            } else {
                pageStatus.textContent =
                    "Admin recognized. Upload buttons should be visible.";
            }

            await loadNotes();

            /*
             * Keep the login status visible after notes load.
             */
            if (!user) {
                pageStatus.textContent =
                    "Not logged in. Please sign in first.";
                showLoginLink();
            } else if (!isAdmin) {
                pageStatus.textContent =
                    "Signed in, but this account is not the authorized admin. " +
                    "Current UID: " + user.uid;
            } else {
                pageStatus.textContent =
                    "Admin recognized. Upload buttons should be visible.";
                renderChapters();
            }
        });
    } catch (error) {
        console.error("Firebase authentication error:", error);
        pageStatus.textContent =
            "Firebase authentication error: " + error.message;
    }
}

renderChapters();
startPage();
</script>

</body>
</html>
