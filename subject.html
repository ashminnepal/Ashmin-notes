
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
    getFirestore, collection, getDocs, addDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import {
    getAuth, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyDi2MagVoXj6STUHRg8tCAp53RuoFsTN2M",
    authDomain: "my-bitm-notes.firebaseapp.com",
    projectId: "my-bitm-notes",
    storageBucket: "my-bitm-notes.firebasestorage.app",
    messagingSenderId: "806626631556",
    appId: "1:806626631556:web:3e1ff6d9474580fc5e47d1",
    measurementId: "G-RYR93GQ15R"
};

const ADMIN_UID = "DL3vp2hyOXeIgAyd3lvkK7vIF1z1";
const UPLOAD_FUNCTION_URL =
    "https://alwoegbhtotladrtaouk.supabase.co/functions/v1/upload-pdf";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const params = new URLSearchParams(window.location.search);
const semester = params.get("semester");
const subjectIndex = params.get("subject");

const subjects = {
    1: ["Foundation of Information Technology", "C Programming", "English 1",
        "Foundation of Business Management", "Basic Mathematics", "Assignment"],
    2: ["Digital Logic", "Java Programming", "Discrete Structure",
        "Business Communication", "OBHRM", "Assignment"],
    3: ["Microprocessor And Computer Architecture", "Web Technology 1",
        "Data Structure And Algorithms", "Financial Accounting",
        "Business Statistics", "Assignment"],
    4: ["Web Technology", "Database Management System",
        "Business Data Communication And Networking", "Operating System",
        "Economics For Business", "Cost And Management Accounting"],
    5: ["Software Design And Development", "Programming With Python",
        "Information Security", "Fundamentals Of Marketing",
        "Artificial Intelligence", "Assignment"],
    6: ["Business Information System", "IT Ethics And Cybersecurity",
        "Fundamentals of Corporate Finance", "Business Environment",
        "Business Research Method", "Assignment"],
    7: ["E-commerce And Internet Marketing", "Sociology For Business Management",
        "Operations Management", "Strategic Management", "Internship",
        "Project/Assignment"],
    8: ["IT Entrepreneurship And Management", "Business Intelligence",
        "Digital Economy", "Project", "Project", "Project"]
};

const chapters = {
    "1-1": ["Introduction to Programming Language", "Basic Elements of C",
        "Data Input and Output", "Operators", "Control Statements",
        "Functions, Arrays and Strings", "Pointers", "Structures and Unions",
        "Preprocessor in C", "File Handling", "Graphics Programming in C"],
    "1-2": ["Cross-Cultural Communication", "Mass Media, Information, and Technology",
        "Issues of Ethics", "Tradition, Progress, and Development",
        "Self, Reflection, and Experience", "Observation, Change, and Description"],
    "1-3": ["Introduction to Business and Management",
        "Planning, Decision Making and Problem Solving", "Organizing",
        "Leadership", "Controlling",
        "Ethics, Social Responsibility and Contemporary Issues"],
    "1-4": ["Set Theory and Real Number", "Complex Number",
        "Function, Limit and Continuity", "Differential and Its Application",
        "Integration and Its Application", "Differential Equation", "Vector",
        "Matrix and Determinant", "Least Square Method"],
    "1-0": ["IT Computer Fundamentals", "Hardware and Peripherals",
        "Software", "Fundamental Concepts of Data Management",
        "Networking and Internet", "Multimedia",
        "Introduction to IT and Information Systems", "Cybersecurity",
        "IT Ethics", "Emerging Technologies and Digital Transformation"]
};

const subjectName = subjects[semester]?.[subjectIndex];
const chapterGrid = document.getElementById("chapterGrid");
const pageStatus = document.getElementById("pageStatus");
const searchInput = document.getElementById("searchInput");
const darkModeButton = document.getElementById("darkModeButton");

let isAdmin = false;
let savedNotes = [];

if (!subjectName) {
    document.getElementById("subjectName").textContent = "Subject not found";
    document.getElementById("semesterName").textContent = "";
    chapterGrid.textContent =
        "Please return to the main page and select a subject.";
} else {
    document.getElementById("subjectName").textContent = subjectName;
    document.getElementById("semesterName").textContent =
        `Semester ${semester} • BITM`;
}

/* ACCEPT OLD GOOGLE DRIVE LINKS AND NEW SUPABASE PDF LINKS */

function isValidPdfLink(value) {
    try {
        const url = new URL(value);

        if (url.protocol !== "https:") return false;

        const isGoogleDrive =
            url.hostname === "drive.google.com" ||
            url.hostname === "docs.google.com";

        const isSupabasePdf =
            url.hostname === "alwoegbhtotladrtaouk.supabase.co" &&
            url.pathname.startsWith(
                "/storage/v1/object/public/bitm-pdfs/"
            ) &&
            url.pathname.toLowerCase().endsWith(".pdf");

        return isGoogleDrive || isSupabasePdf;
    } catch {
        return false;
    }
}

function getChapterNotes(chapterNumber) {
    return savedNotes.filter(note =>
        note.semester === `Semester ${semester}` &&
        note.subject === subjectName &&
        note.chapter === chapterNumber
    );
}

function makePdfLink(note) {
    const link = document.createElement("a");
    link.className = "saved-pdf";
    link.href = note.pdfLink;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = `${note.type || "PDF"}: ${note.title || "Open PDF"}`;
    return link;
}

/* UPLOAD A PDF DIRECTLY FROM YOUR COMPUTER */

async function addPdfToChapter(chapterNumber) {
    if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
        alert("Please sign in with your authorized admin account.");
        return;
    }

    const title = prompt("Enter the PDF title:");
    if (!title || !title.trim()) return;

    const type = prompt(
        "Enter content type: Notes, Syllabus, or Assignment",
        "Notes"
    );

    if (!type) return;

    const cleanType = type.trim();

    if (!["Notes", "Syllabus", "Assignment"].includes(cleanType)) {
        alert("Please enter Notes, Syllabus, or Assignment.");
        return;
    }

    const file = await new Promise(resolve => {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = ".pdf,application/pdf";

        input.addEventListener("change", () => {
            resolve(input.files?.[0] || null);
        }, { once: true });

        input.click();
    });

    if (!file) return;

    if (
        file.type !== "application/pdf" ||
        !file.name.toLowerCase().endsWith(".pdf")
    ) {
        alert("Please select a PDF file.");
        return;
    }

    if (file.size === 0 || file.size > 50 * 1024 * 1024) {
        alert("The PDF must be smaller than 50 MB.");
        return;
    }

    try {
        pageStatus.textContent = "Uploading PDF... Please wait.";

        const token = await auth.currentUser.getIdToken();
        const formData = new FormData();
        formData.append("file", file);

        const response = await fetch(UPLOAD_FUNCTION_URL, {
            method: "POST",
            headers: {
                Authorization: `Bearer ${token}`
            },
            body: formData
        });

        const result = await response.json();

        if (!response.ok || !result.success || !result.pdfLink) {
            throw new Error(result.error || "PDF upload failed.");
        }

        if (!isValidPdfLink(result.pdfLink)) {
            throw new Error("The storage service returned an invalid PDF link.");
        }

        pageStatus.textContent = "Saving PDF information...";

        await addDoc(collection(db, "notes"), {
            semester: `Semester ${semester}`,
            subject: subjectName,
            chapter: chapterNumber,
            type: cleanType,
            title: title.trim(),
            pdfLink: result.pdfLink,
            storagePath: result.path || "",
            createdAt: serverTimestamp()
        });

        await loadNotes();
        pageStatus.textContent = "PDF uploaded and saved successfully!";
    } catch (error) {
        console.error("PDF upload error:", error);
        pageStatus.textContent = "Upload failed: " + error.message;
    }
}

/* DISPLAY CHAPTERS AND PDF BUTTONS */

function renderChapters() {
    chapterGrid.replaceChildren();

    if (!subjectName) return;

    const chapterList = chapters[`${semester}-${subjectIndex}`];

    if (!chapterList) {
        const card = document.createElement("div");
        card.className = "chapter-card";

        const text = document.createElement("div");
        text.className = "chapter-name";
        text.textContent = "Chapters will be added soon.";

        card.appendChild(text);
        chapterGrid.appendChild(card);
        return;
    }

    chapterList.forEach((chapter, index) => {
        const chapterNumber = `Chapter ${index + 1}`;
        const card = document.createElement("div");
        card.className = "chapter-card";

        const number = document.createElement("div");
        number.className = "chapter-number";
        number.textContent = chapterNumber;

        const name = document.createElement("div");
        name.className = "chapter-name";
        name.textContent = chapter;

        const options = document.createElement("div");
        options.className = "chapter-options";

        const chapterNotes = getChapterNotes(chapterNumber);

        function createTypeButton(type, label, emptyMessage) {
            const button = document.createElement("a");
            button.className = "pdf-button";
            button.textContent = label;

            const note = chapterNotes.find(item => item.type === type);

            if (note && isValidPdfLink(note.pdfLink)) {
                button.href = note.pdfLink;
                button.target = "_blank";
                button.rel = "noopener noreferrer";
            } else {
                button.href = "#";
                button.addEventListener("click", event => {
                    event.preventDefault();
                    alert(emptyMessage);
                });
            }

            return button;
        }

        options.append(
            createTypeButton(
                "Syllabus",
                "📚 Syllabus",
                "No syllabus PDF has been added for this chapter yet."
            ),
            createTypeButton(
                "Assignment",
                "📝 Assignment",
                "No assignment PDF has been added for this chapter yet."
            )
        );

        if (isAdmin) {
            const addButton = document.createElement("button");
            addButton.type = "button";
            addButton.className = "admin-add-button";
            addButton.textContent = "＋ Upload PDF";

            addButton.addEventListener("click", () => {
                addPdfToChapter(chapterNumber);
            });

            options.appendChild(addButton);
        }

        const pdfContainer = document.createElement("div");
        pdfContainer.className = "saved-pdfs";

        chapterNotes
            .filter(note =>
                note.type !== "Syllabus" &&
                note.type !== "Assignment" &&
                isValidPdfLink(note.pdfLink)
            )
            .forEach(note => {
                pdfContainer.appendChild(makePdfLink(note));
            });

        card.append(number, name, options, pdfContainer);
        chapterGrid.appendChild(card);
    });

    applySearch();
}

/* LOAD EXISTING AND NEW PDF RECORDS */

async function loadNotes() {
    pageStatus.textContent = "Loading saved PDFs...";

    try {
        const snapshot = await getDocs(collection(db, "notes"));

        savedNotes = snapshot.docs.map(item => ({
            id: item.id,
            ...item.data()
        }));

        renderChapters();
        pageStatus.textContent = "";
    } catch (error) {
        console.error("Could not load PDFs:", error);
        pageStatus.textContent =
            "Could not load PDFs. Check Firestore rules and your internet connection.";
    }
}

/* SEARCH */

function applySearch() {
    const search = searchInput.value.toLowerCase();

    document.querySelectorAll(".chapter-card").forEach(card => {
        card.style.display =
            card.innerText.toLowerCase().includes(search) ? "" : "none";
    });
}

searchInput.addEventListener("input", applySearch);

/* DARK MODE — KEEP THE EXISTING SHARED SETTING */

if (localStorage.getItem("darkMode") === "enabled") {
    document.body.classList.add("dark-mode");
    darkModeButton.textContent = "☀️";
}

darkModeButton.addEventListener("click", () => {
    document.body.classList.toggle("dark-mode");

    const enabled = document.body.classList.contains("dark-mode");

    localStorage.setItem("darkMode", enabled ? "enabled" : "disabled");
    darkModeButton.textContent = enabled ? "☀️" : "🌙";
});

/* ADMIN LOGIN CHECK */

onAuthStateChanged(auth, async user => {
    isAdmin = !!user && user.uid === ADMIN_UID;
    await loadNotes();
});
</script>
