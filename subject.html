<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My BITM Notes</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
    background:#f4f7fb;
    color:#111827;
}

/* Header */

.header{
    background:#F7FBFF;
    padding:14px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    box-shadow:0 2px 12px rgba(0,0,0,0.08);
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:190px;
}

.logo-icon{
    width:46px;
    height:46px;
    border-radius:12px;
    background:#0b4db8;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}

.logo-text h1{
    font-size:22px;
    color:#0b4db8;
    line-height:1;
}

.logo-text span{
    font-size:14px;
    color:#6b7280;
}

.search-box{
    flex:1;
    max-width:650px;
    background:#f4f7fb;
    border:1px solid #dbe3f0;
    border-radius:999px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 18px;
}

.search-box span{
    color:#6b7280;
    font-size:18px;
}

.search-box input{
    border:none;
    outline:none;
    background:transparent;
    width:100%;
    font-size:15px;
}

.actions{
    display:flex;
    align-items:center;
    gap:14px;
}

.profile{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #e5e7eb;
}

.icon{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#f4f7fb;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:0.2s;
    font-size:18px;
}

.icon:hover{
    background:#e8f0fe;
}

/* Main */

.main{
    max-width:1200px;
    margin:auto;
    padding:30px;
}

/* Back Button */

.back-button{
    display:inline-block;
    margin-bottom:25px;
    padding:10px 18px;
    background:#0b4db8;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:600;
}

.back-button:hover{
    background:#0a44a3;
}

/* Subject Header */

.subject-header{
    background:#0b4db8;
    color:white;
    border-radius:22px;
    padding:30px;
    margin-bottom:30px;
}

.subject-header h1{
    font-size:30px;
    margin-bottom:8px;
}

.subject-header p{
    font-size:16px;
    opacity:0.9;
}

/* Chapter Section */

.chapter-title{
    font-size:24px;
    color:#0b4db8;
    margin-bottom:20px;
    font-weight:700;
}

.chapter-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

/* Chapter Card */

.chapter-card{
    background:white;
    border-radius:18px;
    padding:22px;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
    border-left:6px solid #0b4db8;
    transition:0.2s;
}

.chapter-card:hover{
    transform:translateY(-3px);
    background:#f8fbff;
}

.chapter-number{
    font-size:14px;
    font-weight:700;
    color:#0b4db8;
    margin-bottom:10px;
}

.chapter-name{
    font-size:18px;
    font-weight:700;
    line-height:1.4;
}

/* PDF Button */

.pdf-button{
    display:inline-block;
    margin-top:15px;
    padding:9px 14px;
    background:#e8f0fe;
    color:#0b4db8;
    text-decoration:none;
    border-radius:8px;
    font-weight:600;
}

.pdf-button:hover{
    background:#dbeafe;
}

/* Mobile */

@media(max-width:700px){

    .header{
        flex-wrap:wrap;
    }

    .search-box{
        order:3;
        width:100%;
        max-width:none;
    }

    .main{
        padding:18px;
    }

    .subject-header{
        padding:22px;
    }

    .subject-header h1{
        font-size:24px;
    }

}

</style>
</head>

<body>

<!-- Header -->

<div class="header">

    <div class="logo">

        <div class="logo-icon">
            📘
        </div>

        <div class="logo-text">

            <h1>My BITM</h1>
            <span>Notes</span>

        </div>

    </div>


    <div class="search-box">

        <span>🔍</span>

        <input
            type="text"
            id="searchInput"
            placeholder="Search chapters..."
        >

    </div>


    <div class="actions">

        <a href="profile.html">

            <img
                src="profile.jpg"
                class="profile"
                alt="Profile"
            >

        </a>

        <div class="icon">
            🔔
        </div>

        <div class="icon">
            ⚙️
        </div>

    </div>

</div>


<!-- Main -->

<div class="main">

    <a href="index.html" class="back-button">
        ← Back to My BITM
    </a>


    <!-- Subject Information -->

    <div class="subject-header">

        <h1 id="subjectName">
            Subject
        </h1>

        <p id="semesterName">
            Semester • BITM
        </p>

    </div>


    <div class="chapter-title">
        Chapters
    </div>


    <!-- Chapters -->

    <div
        class="chapter-grid"
        id="chapterGrid"
    ></div>

</div>


<script>

/* Get information from URL */

const params =
    new URLSearchParams(window.location.search);

const semester =
    params.get("semester");

const subjectIndex =
    params.get("subject");


/* Subject names */

const subjects = {

    1:[
        "Foundation of Information Technology",
        "C Programming",
        "English 1",
        "Foundation of Business Management",
        "Basic Mathematics",
        "Assignment"
    ],

    2:[
        "Digital Logic",
        "Java Programming",
        "Discrete Structure",
        "Business Communication",
        "OBHRM",
        "Assignment"
    ],

    3:[
        "Microprocessor And Computer Architecture",
        "Web Technology 1",
        "Data Structure And Algorithms",
        "Financial Accounting",
        "Business Statistics",
        "Assignment"
    ],

    4:[
        "Web Technology",
        "Database Management System",
        "Business Data Communication And Networking",
        "Operating System",
        "Economics For Business",
        "Cost And Management Accounting"
    ],

    5:[
        "Software Design And Development",
        "Programming With Python",
        "Information Security",
        "Fundamentals Of Marketing",
        "Artificial Intelligence",
        "Assignment"
    ],

    6:[
        "Business Information System",
        "IT Ethics And Cybersecurity",
        "Fundamentals of Corporate Finance",
        "Business Environment",
        "Business Research Method",
        "Assignment"
    ],

    7:[
        "E-commerce And Internet Marketing",
        "Sociology For Business Management",
        "Operations Management",
        "Strategic Management",
        "Internship",
        "Project/Assignment"
    ],

    8:[
        "IT Entrepreneurship And Management",
        "Business Intelligence",
        "Digital Economy",
        "Project",
        "Project",
        "Project"
    ]

};


/* Chapters for subjects */

const chapters = {

    /* C Programming */

    "1-1":[

        "Introduction to Programming Language",

        "Basic Elements of C",

        "Data Input and Output",

        "Operators",

        "Control Statements",

        "Functions, Arrays and Strings",

        "Pointers",

        "Structures and Unions",

        "Preprocessor in C",

        "File Handling",

        "Graphics Programming in C"

    ],


    /* Foundation of Business Management */

    "1-3":[

        "Introduction to Business and Management",

        "Planning, Decision Making and Problem Solving",

        "Organizing",

        "Leadership",

        "Controlling",

        "Ethics, Social Responsibility and Contemporary Issues"

    ],


    /* IT Computer Fundamentals */

    "1-0":[

        "IT Computer Fundamentals",

        "Hardware and Peripherals",

        "Software",

        "Fundamental Concepts of Data Management",

        "Networking and Internet",

        "Multimedia",

        "Introduction to IT and Information Systems",

        "Cybersecurity",

        "IT Ethics",

        "Emerging Technologies and Digital Transformation"

    ]

};


/* Find subject name */

const subjectName =
    subjects[semester][subjectIndex];


/* Display subject name */

document.getElementById("subjectName").innerText =
    subjectName;

document.getElementById("semesterName").innerText =
    `Semester ${semester} • BITM`;


/* Find chapters */

const chapterList =
    chapters[`${semester}-${subjectIndex}`];


/* Chapter container */

const chapterGrid =
    document.getElementById("chapterGrid");


/* Display chapters */

if(chapterList){

    chapterList.forEach((chapter,index)=>{

        chapterGrid.innerHTML += `

            <div class="chapter-card">

                <div class="chapter-number">
                    Chapter ${index + 1}
                </div>

                <div class="chapter-name">
                    ${chapter}
                </div>

                <a
                    href="#"
                    class="pdf-button"
                >
                    📄 View PDF
                </a>

            </div>

        `;

    });

}else{

    chapterGrid.innerHTML = `

        <div class="chapter-card">

            <div class="chapter-name">
                Chapters will be added soon.
            </div>

        </div>

    `;

}


/* Search chapters */

document
.getElementById("searchInput")
.addEventListener("input",function(){

    const search =
        this.value.toLowerCase();

    document
    .querySelectorAll(".chapter-card")
    .forEach(card=>{

        const text =
            card.innerText.toLowerCase();

        if(text.includes(search)){

            card.style.display = "";

        }else{

            card.style.display = "none";

        }

    });

});

</script>

</body>
</html>
